apiVersion: v1
kind: Pod
metadata:
  name: storage-affinity-test
  namespace: default
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sleep
        - "3600"
      volumeMounts:
        - name: persistent-data
          mountPath: /data
          readOnly: true

  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: data-stateful-lab-1
        readOnly: true