apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-app
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: slow-app

  template:
    metadata:
      labels:
        app: slow-app

    spec:
      containers:
        - name: slow-app
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Application starting..."
              sleep 30
              echo "Application ready!"
              mkdir -p /www
              echo "OK" > /www/index.html
              httpd -f -p 8080 -h /www

          ports:
            - containerPort: 8080

          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 1

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3