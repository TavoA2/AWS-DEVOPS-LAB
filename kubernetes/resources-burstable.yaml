apiVersion: v1
kind: Pod
metadata:
  name: resources-burstable
  namespace: default
  labels:
    app: resources-lab

spec:
  containers:
    - name: busybox
      image: busybox:1.36

      command:
        - sh
        - -c
        - sleep 86400

      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"

        limits:
          cpu: "500m"
          memory: "256Mi"