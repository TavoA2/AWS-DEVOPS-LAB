apiVersion: v1
kind: Pod
metadata:
  name: storage-lab
  namespace: default
  labels:
    app: storage-lab
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 86400
      volumeMounts:
        - name: persistent-data
          mountPath: /data

  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: storage-lab-pvc