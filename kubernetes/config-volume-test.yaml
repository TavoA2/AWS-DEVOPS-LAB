apiVersion: v1
kind: Pod
metadata:
  name: config-volume-test
spec:
  containers:
    - name: config-volume-test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]

      volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true

  volumes:
    - name: config-volume
      configMap:
        name: api-config

  restartPolicy: Never