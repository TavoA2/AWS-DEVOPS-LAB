apiVersion: v1
kind: Service
metadata:
  name: stateful-lab
spec:
  clusterIP: None
  selector:
    app: stateful-lab
  ports:
    - name: placeholder
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-lab
spec:
  serviceName: stateful-lab
  replicas: 3
  selector:
    matchLabels:
      app: stateful-lab
  template:
    metadata:
      labels:
        app: stateful-lab
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command:
            - sleep
            - "86400"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi