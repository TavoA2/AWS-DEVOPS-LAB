apiVersion: v1
kind: Pod
metadata:
  name: memory-stress
  namespace: default
  labels:
    app: memory-stress

spec:
  restartPolicy: Always

  containers:
    - name: memory-stress
      image: python:3.12-alpine

      command:
        - python
        - -u
        - -c
        - |
          import time

          chunks = []

          print("Starting memory stress test...", flush=True)

          while True:
              chunks.append(bytearray(8 * 1024 * 1024))

              print(
                  f"Allocated: {len(chunks) * 8} MiB",
                  flush=True
              )

              time.sleep(2)

      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"

        limits:
          cpu: "500m"
          memory: "64Mi"