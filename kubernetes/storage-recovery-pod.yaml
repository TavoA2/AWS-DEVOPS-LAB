apiVersion: v1
kind: Pod
metadata:
  name: storage-recovery
  namespace: default
  labels:
    app: storage-recovery
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sleep
        - "86400"

      volumeMounts:
        - name: recovered-data
          mountPath: /data

  volumes:
    - name: recovered-data
      persistentVolumeClaim:
        claimName: storage-recovery-pvc