apiVersion: v1
kind: Pod
metadata:
  name: emptydir-lab
  labels:
    app: emptydir-lab
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sleep
        - "86400"
      volumeMounts:
        - name: temp-data
          mountPath: /cache

  volumes:
    - name: temp-data
      emptyDir: {}