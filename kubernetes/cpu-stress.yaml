apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  namespace: default
  labels:
    app: cpu-stress

spec:
  containers:
    - name: cpu-stress
      image: busybox:1.36

      command:
        - sh
        - -c
        - |
          echo "Starting CPU stress test..."
          while true; do
            :
          done

      resources:
        requests:
          cpu: "100m"
          memory: "32Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"