apiVersion: v1
kind: Pod
metadata:
  name: config-test
spec:
  containers:
    - name: config-test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]
      envFrom:
        - configMapRef:
            name: api-config
        - secretRef:
            name: api-secret
  restartPolicy: Never