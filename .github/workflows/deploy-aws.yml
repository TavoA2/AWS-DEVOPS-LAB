name: AWS Deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish to ECR only, or deploy to the running dev lab
        required: true
        type: choice
        default: image-only
        options:
          - image-only
          - deploy

permissions:
  contents: read

concurrency:
  group: aws-deployment-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_PAGER: ''
  ECR_REPOSITORY: dev-aws-devops-lab-web
  IMAGE: aws-devops-lab-web:${{ github.sha }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag "$IMAGE" ./app

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Save scanned image
        run: docker save --output image.tar "$IMAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: scanned-image
          path: image.tar
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.ecr.outputs.image_uri }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scanned-image

      - run: docker load --input image.tar

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::200015573044:role/github-actions-terraform-role
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Publish scanned image to existing ECR repository
        id: ecr
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          uri="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>ecr-error; then
            docker pull "$uri"
            test "$(docker image inspect --format '{{.Id}}' "$uri")" = \
              "$(docker image inspect --format '{{.Id}}' "$IMAGE")" || {
                echo 'The immutable ECR tag contains a different image than the scanned build.' >&2
                exit 1
              }
          elif grep -Fq 'ImageNotFoundException' ecr-error; then
            docker tag "$IMAGE" "$uri"
            docker push "$uri"
          else
            cat ecr-error >&2
            exit 1
          fi
          echo "image_uri=$uri" >> "$GITHUB_OUTPUT"

  deploy:
    if: inputs.mode == 'deploy'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ASG_NAME: dev-web-asg
      IMAGE_URI: ${{ needs.publish.outputs.image_uri }}
      TF_VAR_container_image_tag: ${{ github.sha }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::200015573044:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check the running lab and capture a stable version
        run: bash .github/scripts/deploy-aws.sh preflight

      - name: Plan and apply the launch template update
        run: bash .github/scripts/deploy-aws.sh template

      - name: Start and record this deployment's instance refresh
        id: refresh
        run: bash .github/scripts/deploy-aws.sh start

      - name: Wait for the refresh and validate the application
        run: bash .github/scripts/deploy-aws.sh verify

      - name: Restore the verified stable version
        if: failure() && steps.refresh.outputs.started == 'true'
        run: bash .github/scripts/deploy-aws.sh rollback
